name: Build, Smoke Test, and Publish GHCR
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: eramesh-deploy-lab-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build local test image
        run: docker build -t eramesh-deploy-lab:test .

      - name: Smoke test GET /health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name eramesh-lab-ci -p 127.0.0.1:18080:8080 eramesh-deploy-lab:test
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health | grep -q '"status":"healthy"'; then
              echo 'Smoke test passed'
              exit 0
            fi
            sleep 1
          done
          docker logs eramesh-lab-ci
          exit 1

      - name: Stop smoke-test container
        if: always()
        run: docker rm -f eramesh-lab-ci || true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eramesh-deploy-lab:latest
            ghcr.io/${{ github.repository_owner }}/eramesh-deploy-lab:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
